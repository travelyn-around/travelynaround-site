    var html=new TextDecoder().decode(p);
    document.open();document.write(html);document.close();
  }catch(e){err.textContent="That password didn't work. Try again.";}
}
document.getElementById("go").onclick=unlock;
document.getElementById("pw").onkeydown=function(e){if(e.key==="Enter")unlock();};
</script>
